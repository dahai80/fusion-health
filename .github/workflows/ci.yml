name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Ruff check
        run: ruff check .

      - name: Pytest
        run: pytest -q
