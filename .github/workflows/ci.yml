name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fusion-core (in-tree dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-core.git
        # fusion-core is an in-tree editable install in the monorepo venv
        # but has no PyPI release, so CI resolves it from git. See
        # dahai80/fusion-core#9 for the permanent publish-track fix.

      - name: Install package with test+api extras
        run: pip install -e ".[test,api]"

      - name: Ruff check
        run: ruff check .

      - name: Pytest with coverage
        run: pytest --cov=fusion_health --cov-report=term-missing -q

      - name: Enforce coverage floor (80%)
        run: |
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(["coverage", "report"], capture_output=True, text=True)
          print(out.stdout)
          m = re.search(r"TOTAL\s+\d+\s+\d+\s+(\d+)%", out.stdout)
          if not m:
              print("could not parse coverage total"); sys.exit(1)
          pct = int(m.group(1))
          if pct < 80:
              print(f"coverage {pct}% below 80% floor"); sys.exit(1)
          print(f"coverage {pct}% OK")
          PY

      - name: pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          # --strict removed: en_core_web_sm is a direct wheel (not PyPI), would false-fail.
          # Real CVEs still exit non-zero.
          pip-audit --desc on

      - name: Bandit SAST scan
        run: |
          pip install bandit
          bandit -r fusion_health -q
