name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# fusion#2 CI retrofit (issue #38): cancel superseded runs on the same
# branch/PR instead of queueing another full matrix behind the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fusion#2 CI retrofit (issue #38): docs/comments-only changes skip the
  # test jobs. Job-level conditional (not `paths-ignore`) so required checks
  # still report — skipped counts as success for branch protection, whereas
  # `paths-ignore` would remove the checks entirely and block merge.
  changes:
    runs-on: ubuntu-latest
    # paths-filter reads PR changed files via the API — default token needs
    # explicit pull-requests: read (fails with "not accessible by integration")
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'fusion_health/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  lint-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install fusion-core (in-tree dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-core.git
        # fusion-core is an in-tree editable install in the monorepo venv
        # but has no PyPI release, so CI resolves it from git. See
        # dahai80/fusion-core#9 for the permanent publish-track fix.

      - name: Install package with test+api extras
        run: pip install -e ".[test,api]"

      - name: Ruff check
        run: ruff check .

      - name: Pytest with coverage
        run: pytest --cov=fusion_health --cov-report=term-missing -q

      - name: Enforce coverage floor (80%)
        run: |
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(["coverage", "report"], capture_output=True, text=True)
          print(out.stdout)
          m = re.search(r"TOTAL\s+\d+\s+\d+\s+(\d+)%", out.stdout)
          if not m:
              print("could not parse coverage total"); sys.exit(1)
          pct = int(m.group(1))
          if pct < 80:
              print(f"coverage {pct}% below 80% floor"); sys.exit(1)
          print(f"coverage {pct}% OK")
          PY

      - name: pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          # --strict removed: en_core_web_sm is a direct wheel (not PyPI), would false-fail.
          # Real CVEs still exit non-zero.
          pip-audit --desc on

      - name: Bandit SAST scan
        run: |
          pip install bandit
          bandit -r fusion_health -q
