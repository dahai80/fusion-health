name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fusion-core (in-tree dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-core.git
        # fusion-core is an in-tree editable install in the monorepo venv
        # but has no PyPI release, so CI resolves it from git. See
        # dahai80/fusion-core#9 for the permanent publish-track fix.

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Ruff check
        run: ruff check .

      - name: Pytest
        run: pytest -q
