[project]
name = "fusion-health"
version = "0.1.0"
description = "Fusion-Health — Local AI healthcare assistant powered by fusion-mlx"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "pytest-mock>=3.14.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_health*"]