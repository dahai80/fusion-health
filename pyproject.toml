[project]
name = "fusion-health"
version = "1.0.1"
description = "Fusion-Health — Local AI healthcare assistant powered by fusion-mlx"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx>=0.27.0", "pydantic>=2.0.0", "pyyaml>=6.0", "jinja2>=3.1.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "websockets>=12.0"]
tui = ["textual>=0.50.0", "rich>=13.0.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "pytest-mock>=3.14.0"]
all = ["fusion-health[api,tui,test]"]

[project.scripts]
fusion-health = "fusion_health.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_health*"]

[tool.setuptools.package-data]
fusion_health = ["data/**/*.tsv", "compliance/rules/*.yaml", "tcm/data/*.yaml"]
