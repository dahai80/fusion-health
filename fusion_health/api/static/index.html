<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion-Health Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .tab-active { border-color: rgb(79 70 229); color: rgb(79 70 229); }
    </style>
</head>
<body class="h-full bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100">
    <div class="mx-auto max-w-5xl p-4 md:p-8 flex flex-col gap-6">
        <header class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600/10 text-indigo-600 dark:text-indigo-400">
                    <i data-lucide="heart-pulse" class="h-6 w-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-semibold">Fusion-Health Console</h1>
                    <p id="health-line" class="text-xs text-zinc-500 dark:text-zinc-400">loading…</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <input id="api-key" type="password" placeholder="X-API-Key (if set)"
                    class="w-44 rounded-xl border border-zinc-200/80 bg-white px-3 py-1.5 text-sm shadow-sm placeholder:text-zinc-400 focus:border-indigo-400 focus:outline-none dark:border-zinc-800 dark:bg-zinc-900">
                <button onclick="saveKey()" class="rounded-xl bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-500">Save</button>
            </div>
        </header>

        <div id="disclaimer" class="rounded-xl border border-amber-200/80 bg-amber-50 px-4 py-2 text-xs text-amber-800 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-300">
            Advisory-only AI assistance; not a medical device, not NMPA-registered. Verify all output clinically.
        </div>

        <nav class="flex gap-1 border-b border-zinc-200/80 dark:border-zinc-800">
            <button data-tab="overview" class="tab rounded-t-lg border-b-2 border-transparent px-4 py-2 text-sm font-medium text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200">Overview</button>
            <button data-tab="clinical" class="tab rounded-t-lg border-b-2 border-transparent px-4 py-2 text-sm font-medium text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200">EHR &amp; Insurance</button>
            <button data-tab="audit" class="tab rounded-t-lg border-b-2 border-transparent px-4 py-2 text-sm font-medium text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200">Audit chain</button>
            <button data-tab="chat" class="tab rounded-t-lg border-b-2 border-transparent px-4 py-2 text-sm font-medium text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200">Chat</button>
        </nav>

        <main class="flex-1">
            <section id="tab-overview" class="panel hidden flex-col gap-4">
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-3" id="overview-cards"></div>
                <pre id="metrics-out" class="overflow-auto rounded-xl border border-zinc-200/80 bg-white p-4 text-xs shadow-sm dark:border-zinc-800 dark:bg-zinc-900">metrics…</pre>
            </section>

            <section id="tab-clinical" class="panel hidden flex-col gap-4">
                <div class="rounded-xl border border-zinc-200/80 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
                    <label class="text-sm font-medium">Clinical notes</label>
                    <textarea id="clinical-notes" rows="5" class="mt-2 w-full rounded-xl border border-zinc-200/80 bg-zinc-50 p-3 text-sm focus:border-indigo-400 focus:outline-none dark:border-zinc-800 dark:bg-zinc-950"
                        placeholder="Patient notes…"></textarea>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <button onclick="runEhrSummary()" class="rounded-xl bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-500">EHR summary</button>
                        <button onclick="runIcd10()" class="rounded-xl bg-zinc-900 px-3 py-1.5 text-sm font-medium text-white shadow-sm hover:bg-zinc-700 dark:bg-zinc-100 dark:text-zinc-900">ICD-10 codes</button>
                        <button onclick="runDrg()" class="rounded-xl border border-zinc-200/80 bg-white px-3 py-1.5 text-sm font-medium shadow-sm hover:bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900 dark:hover:bg-zinc-800">DRG</button>
                    </div>
                </div>
                <pre id="clinical-out" class="overflow-auto rounded-xl border border-zinc-200/80 bg-white p-4 text-xs shadow-sm dark:border-zinc-800 dark:bg-zinc-900">output…</pre>
            </section>

            <section id="tab-audit" class="panel hidden flex-col gap-4">
                <div class="flex items-center gap-2">
                    <button onclick="runAuditVerify()" class="rounded-xl bg-indigo-600 px-3 py-1.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-500">Verify chain</button>
                    <button onclick="loadAuditRecent()" class="rounded-xl border border-zinc-200/80 bg-white px-3 py-1.5 text-sm font-medium shadow-sm hover:bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900 dark:hover:bg-zinc-800">Recent events</button>
                </div>
                <div id="audit-status" class="rounded-xl border border-zinc-200/80 bg-white p-4 text-sm shadow-sm dark:border-zinc-800 dark:bg-zinc-900">not verified yet</div>
                <div class="overflow-auto rounded-xl border border-zinc-200/80 bg-white shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
                    <table class="w-full text-left text-xs">
                        <thead class="border-b border-zinc-200/80 text-zinc-500 dark:border-zinc-800 dark:text-zinc-400">
                            <tr><th class="p-3">seq</th><th class="p-3">time</th><th class="p-3">owner</th><th class="p-3">action</th><th class="p-3">path</th><th class="p-3">status</th></tr>
                        </thead>
                        <tbody id="audit-rows"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-chat" class="panel hidden flex-col gap-4">
                <div class="flex flex-col rounded-xl border border-zinc-200/80 bg-white shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
                    <div id="chat-log" class="flex h-80 flex-col gap-2 overflow-auto p-4 text-sm"></div>
                    <div class="flex gap-2 border-t border-zinc-200/80 p-3 dark:border-zinc-800">
                        <input id="chat-input" class="flex-1 rounded-xl border border-zinc-200/80 bg-zinc-50 px-3 py-2 text-sm focus:border-indigo-400 focus:outline-none dark:border-zinc-800 dark:bg-zinc-950" placeholder="Message…">
                        <button onclick="sendChat()" class="rounded-xl bg-indigo-600 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-500">Send</button>
                        <button onclick="newChatSession()" class="rounded-xl border border-zinc-200/80 bg-white px-3 py-2 text-sm font-medium shadow-sm hover:bg-zinc-50 dark:border-zinc-800 dark:bg-zinc-900 dark:hover:bg-zinc-800">New</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/ui/assets/app.js"></script>
</body>
</html>
