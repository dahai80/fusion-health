syndromes:
  - id: "肝阳上亢"
    name: "肝阳上亢证"
    gb_code: "GB/T 16751.2-1997"
    symptoms: ["头痛", "眩晕", "面红", "目赤", "急躁易怒", "口苦", "耳鸣"]
    description: "肝失疏泄，气郁化火，肝阳上亢"
  - id: "气虚"
    name: "气虚证"
    gb_code: "GB/T 16751.2-1997"
    symptoms: ["神疲乏力", "气短", "懒言", "自汗", "舌淡", "脉虚"]
    description: "元气不足，脏腑功能减退"
  - id: "血虚"
    name: "血虚证"
    gb_code: "GB/T 16751.2-1997"
    symptoms: ["面色淡白", "头晕", "心悸", "失眠", "手足麻木", "唇甲色淡"]
    description: "血液亏虚，脏腑经络失养"
  - id: "阴虚"
    name: "阴虚证"
    gb_code: "GB/T 16751.2-1997"
    symptoms: ["五心烦热", "潮热", "盗汗", "口干", "舌红少苔", "脉细数"]
    description: "阴液亏少，机体失却濡润滋养"
  - id: "阳虚"
    name: "阳虚证"
    gb_code: "GB/T 16751.2-1997"
    symptoms: ["畏寒", "肢冷", "面色苍白", "小便清长", "舌淡胖", "脉沉迟"]
    description: "阳气亏损，机体失去温煦"
  - id: "痰湿"
    name: "痰湿证"
    gb_code: "GB/T 16751.2-1997"
    symptoms: ["胸闷", "痰多", "肢体困重", "纳呆", "舌苔白腻", "脉滑"]
    description: "痰湿内阻，气机不畅"
  - id: "湿热"
    name: "湿热证"
    gb_code: "GB/T 16751.2-1997"
    symptoms: ["发热", "口苦", "小便短赤", "舌苔黄腻", "脉濡数", "身重"]
    description: "湿热蕴结，气机郁滞"
  - id: "血瘀"
    name: "血瘀证"
    gb_code: "GB/T 16751.2-1997"
    symptoms: ["疼痛", "痛有定处", "肿块", "出血", "舌紫暗", "脉涩"]
    description: "瘀血内阻，血行不畅"
